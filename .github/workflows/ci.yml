name: CI-CD

permissions:
  contents: write
  pull-requests: write
  id-token: write

on:
  push:
  pull_request:

env:
  IMAGE_NAME: iris-api
  REGION: ${{ secrets.ARTIFACT_REGION }}
  REPO: ${{ secrets.ARTIFACT_REPO }}
  PROJECT_ID: ${{ secrets.PROJECT_ID }}

jobs:
  # ---------------------
  # Test Job
  # ---------------------
  test:
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}

    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - uses: iterative/setup-dvc@v1
        with:
          version: 3.63.0

      - name: Install dependencies
        run: |
          pip install pytest pandas joblib scikit-learn mlflow

      - name: Authenticate GCP
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
        run: |
          echo "$GCP_SA_KEY" > /tmp/key.json
          gcloud auth activate-service-account --key-file=/tmp/key.json
          gcloud config set project $PROJECT_ID
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/key.json

      - name: Pull data via DVC
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/key.json
          dvc pull -r mygcs --force

      - name: Run tests
        run: pytest -v -s tests/test_pipeline_mlflow.py --uri "$MLFLOW_TRACKING_URI" > report.txt

      - name: Set up CML
        uses: iterative/setup-cml@v2

      - name: Post CML comment
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "### Pytest Report" > report.md
          cat report.txt >> report.md
          cml comment create report.md


  # ---------------------
  # Build Docker image and push to Artifact Registry
  # ---------------------
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v3
    
      - uses: iterative/setup-dvc@v1
        with:
          version: 3.63.0

      - name: Authenticate GCP
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
        run: |
          echo "$GCP_SA_KEY" > /tmp/key.json
          gcloud auth activate-service-account --key-file=/tmp/key.json
          gcloud config set project $PROJECT_ID
          gcloud auth configure-docker ${{ secrets.ARTIFACT_REGION }}-docker.pkg.dev --quiet
        
      - name: Pull data via DVC
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/key.json
          dvc pull -r mygcs --force

      - name: Build and Push Docker image
        env:
          REGION: ${{ secrets.ARTIFACT_REGION }}
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
          REPO: ${{ secrets.ARTIFACT_REPO }}
          IMAGE_NAME: iris-api
        run: |
          IMAGE_URI=${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/${IMAGE_NAME}:${GITHUB_SHA}
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV


  # ---------------------
  # Deploy to GKE
  # ---------------------
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v3

      - name: Authenticate GCP & connect to cluster
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
          GKE_CLUSTER: ${{ secrets.GKE_CLUSTER }}
          GKE_REGION: ${{ secrets.GKE_REGION }}
        run: |
          echo "$GCP_SA_KEY" > /tmp/key.json
          gcloud auth activate-service-account --key-file=/tmp/key.json
          gcloud config set project $PROJECT_ID
          echo "Fetching credentials for cluster $GKE_CLUSTER in region $GKE_REGION..."
          gcloud container clusters get-credentials $GKE_CLUSTER --region $GKE_REGION --project $PROJECT_ID

      - name: Deploy new image to GKE
        env:
          IMAGE_URI: ${{ env.IMAGE_URI }}
        run: |
          # Apply manifest if not already present
          kubectl apply -f k8s/deployment.yaml || true
          # Update deployment image
          kubectl set image deployment/iris-api iris-api-container=${IMAGE_URI} --record
          kubectl rollout status deployment/iris-api --timeout=2m
